name: Build Busybox ARM64

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-busybox.yml'
      - 'scripts/build-busybox.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bzip2 wget make

      - name: Download busybox source
        run: |
          wget https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar xjf busybox-1.36.1.tar.bz2
          mv busybox-1.36.1 busybox-src
          ls -la busybox-src | head

      - name: Configure busybox
        run: |
          cd busybox-src
          make defconfig
          # Enable static build
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          # Make sure static is set (fallback)
          grep -q '^CONFIG_STATIC=y' .config || echo 'CONFIG_STATIC=y' >> .config
          echo "=== .config check ==="
          grep CONFIG_STATIC .config

      - name: Build busybox
        run: |
          cd busybox-src
          make CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 -j$(nproc)

      - name: Verify binary
        run: |
          cd busybox-src
          file busybox
          ls -la busybox

      - name: Package
        run: |
          mkdir -p output/files/bin
          cp busybox-src/busybox output/files/bin/busybox-arm64
          chmod +x output/files/bin/busybox-arm64

          # Create MANIFEST
          cat > output/MANIFEST << 'EOF'
          name=busybox
          version=1.36.1
          description=Busybox multi-call binary (Zishu build)
          author=zishu
          type=binary
          arch=arm64-v8a
          entrypoint=busybox
          EOF

          # Create tarball
          cd output
          tar czf ../busybox-1.36.1-arm64.tar.gz MANIFEST files/
          cd ..

          # Calculate SHA-256
          sha256sum busybox-1.36.1-arm64.tar.gz > busybox-1.36.1-arm64.tar.gz.sha256

          ls -la busybox-1.36.1-arm64.tar.gz*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: busybox-arm64
          path: busybox-1.36.1-arm64.tar.gz*

      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: busybox-v1.36.1-${{ github.run_number }}
          name: Busybox 1.36.1 ARM64
          body: |
            Busybox 1.36.1 built for ARM64 (aarch64) with static linking.
            Built via GitHub Actions.

            Install:
              curl -O https://github.com/${{ github.repository }}/releases/download/busybox-v1.36.1-${{ github.run_number }}/busybox-1.36.1-arm64.tar.gz
          files: |
            busybox-1.36.1-arm64.tar.gz
            busybox-1.36.1-arm64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
