name: Build Busybox ARM64

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-busybox.yml'
      - 'scripts/build-busybox.sh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu bzip2 wget make file

      - name: Download busybox source
        run: |
          wget https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar xjf busybox-1.36.1.tar.bz2
          mv busybox-1.36.1 busybox-src

      - name: Configure busybox
        run: |
          cd busybox-src
          make defconfig

          # Enable static linking
          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          grep -q '^CONFIG_STATIC=y' .config || echo 'CONFIG_STATIC=y' >> .config

          # Disable problematic applets for ARM64 / modern kernels
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' .config
          sed -i 's/^CONFIG_FEATURE_TC_INGRESS=y/# CONFIG_FEATURE_TC_INGRESS is not set/' .config

          # Disable other applets that often break cross-compilation
          sed -i 's/^CONFIG_FEATURE_MOUNT_NFS=y/# CONFIG_FEATURE_MOUNT_NFS is not set/' .config
          sed -i 's/^CONFIG_FEATURE_MOUNT_CIFS=y/# CONFIG_FEATURE_MOUNT_CIFS is not set/' .config

          echo "=== Config checks ==="
          grep CONFIG_STATIC .config
          grep CONFIG_TC .config || echo "CONFIG_TC disabled"

      - name: Build busybox
        run: |
          cd busybox-src
          make CROSS_COMPILE=aarch64-linux-gnu- ARCH=arm64 -j$(nproc) 2>&1 | tee build.log
          ls -la busybox

      - name: Show build errors (if any)
        if: failure()
        run: |
          cd busybox-src
          echo "=== Last 100 lines of build log ==="
          tail -100 build.log

      - name: Verify binary
        if: success()
        run: |
          cd busybox-src
          file busybox
          ls -la busybox

      - name: Package
        if: success()
        run: |
          mkdir -p output/files/bin
          cp busybox-src/busybox output/files/bin/busybox-arm64
          chmod +x output/files/bin/busybox-arm64

          cat > output/MANIFEST << 'EOF'
          name=busybox
          version=1.36.1
          description=Busybox multi-call binary (Zishu build)
          author=zishu
          type=binary
          arch=arm64-v8a
          entrypoint=busybox
          EOF

          cd output
          tar czf ../busybox-1.36.1-arm64.tar.gz MANIFEST files/
          cd ..
          sha256sum busybox-1.36.1-arm64.tar.gz > busybox-1.36.1-arm64.tar.gz.sha256
          ls -la busybox-1.36.1-arm64.tar.gz*

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: busybox-arm64
          path: busybox-1.36.1-arm64.tar.gz*

      - name: Create release
        if: success() && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: busybox-v1.36.1-${{ github.run_number }}
          name: Busybox 1.36.1 ARM64
          body: |
            Busybox 1.36.1 built for ARM64 (aarch64).

            Note: CONFIG_TC disabled due to modern kernel headers.
          files: |
            busybox-1.36.1-arm64.tar.gz
            busybox-1.36.1-arm64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
