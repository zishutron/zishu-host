name: Build Python Launcher

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu wget unzip file

      - name: Download Chaquopy headers
        run: |
          wget https://repo.maven.apache.org/maven2/com/chaquo/python/target/3.13.9-0/target-3.13.9-0-arm64-v8a.zip
          mkdir -p chaquopy
          cd chaquopy
          unzip ../target-3.13.9-0-arm64-v8a.zip
          ls -la include/

      - name: Create launcher.c
        run: |
          cat > launcher.c << 'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <dlfcn.h>

          typedef int (*py_main_func)(int, char**);

          int main(int argc, char *argv[]) {
              // Set Python home environment variable
              setenv("PYTHONHOME", "/data/user/0/com.zishu.terminal/files/usr", 1);
              setenv("PYTHONPATH", "/data/user/0/com.zishu.terminal/files/usr/lib/python3.13:/data/user/0/com.zishu.terminal/files/usr/lib/python3.13/lib-dynload", 1);

              // Try to load libpython3.13.so from multiple paths
              const char *lib_paths[] = {
                  "/data/user/0/com.zishu.terminal/files/usr/lib/libpython3.13.so",
                  "/data/data/com.zishu.terminal/files/usr/lib/libpython3.13.so",
                  "libpython3.13.so",
                  NULL
              };

              void *handle = NULL;
              for (int i = 0; lib_paths[i] != NULL; i++) {
                  handle = dlopen(lib_paths[i], RTLD_LAZY | RTLD_GLOBAL);
                  if (handle != NULL) {
                      break;
                  }
              }

              if (handle == NULL) {
                  fprintf(stderr, "Error: could not load libpython3.13.so\n");
                  fprintf(stderr, "dlerror: %s\n", dlerror());
                  return 1;
              }

              py_main_func Py_Main = (py_main_func) dlsym(handle, "Py_Main");
              if (Py_Main == NULL) {
                  fprintf(stderr, "Error: Py_Main not found\n");
                  fprintf(stderr, "dlerror: %s\n", dlerror());
                  dlclose(handle);
                  return 1;
              }

              int result = Py_Main(argc, argv);

              dlclose(handle);
              return result;
          }
          EOF
          cat launcher.c

      - name: Build launcher
        run: |
          aarch64-linux-gnu-gcc \
            -o python3 \
            launcher.c \
            -ldl \
            -static-libgcc
          file python3
          ls -la python3

      - name: Verify binary
        run: |
          file python3
          readelf -d python3 | head -20

      - name: Package
        run: |
          mkdir -p output/files/bin
          cp python3 output/files/bin/python3
          chmod +x output/files/bin/python3

          cat > output/MANIFEST << 'EOF'
          name=python-launcher
          version=3.13.9
          description=Python 3.13.9 launcher for Zishu Terminal (Chaquopy runtime)
          author=zishu
          type=binary
          arch=arm64-v8a
          entrypoint=python3
          EOF

          cd output
          tar czf ../python-launcher-3.13.9-arm64.tar.gz MANIFEST files/
          cd ..
          sha256sum python-launcher-3.13.9-arm64.tar.gz > python-launcher-3.13.9-arm64.tar.gz.sha256
          ls -la python-launcher-3.13.9-arm64.tar.gz*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-launcher
          path: python-launcher-3.13.9-arm64.tar.gz*

      - name: Create release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: python-launcher-v3.13.9-${{ github.run_number }}
          name: Python Launcher 3.13.9 ARM64
          body: |
            Python 3.13.9 launcher for Zishu Terminal.
            Uses Chaquopy Python runtime via dlopen.
          files: |
            python-launcher-3.13.9-arm64.tar.gz
            python-launcher-3.13.9-arm64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
